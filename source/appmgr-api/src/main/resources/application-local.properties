# Database
spring.datasource.url=jdbc:mysql://localhost:3306/db_appmgr?useUnicode=yes&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone = UTC
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.liquibase.change-log=classpath:liquibase/db.changelog-master.xml
spring.liquibase.contexts=dev
spring.liquibase.enabled=true

# SERVER
server.port = 8787
spring.main.allow-bean-definition-overriding=true
#spring.jackson.serialization.INDENT_OUTPUT=true
#spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

#EXCEPTION HANDLER
server.error.whitelabel.enabled=false
spring.web.resources.add-mappings=false

# pageable
spring.data.web.pageable.max-page-size=100

#LOG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=WARN
logging.level.com.appmgr.api=DEBUG
logging.level.org.springframework.web=WARN
logging.level.liquibase=INFO
logging.file.name=logs/appmgr-api.json

